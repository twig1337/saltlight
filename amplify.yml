# Site OS amplify.yml — brochure (no Gen 2 backend deploy)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use lts/jod || nvm use 22
        - npm ci
        - npm run lint
        - npm test
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
