# Site OS amplify.yml — brochure (no Gen 2 backend deploy)
# Server-only env must be written into .env.production so Next SSR runtime sees them.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use lts/jod || nvm use 22
        - npm ci
        - npm run lint
        - npm test
    build:
      commands:
        - env | grep -E '^(CONTACT_|SES_|NEXT_PUBLIC_|AWS_REGION)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
