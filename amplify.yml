# Site OS amplify.yml — static/brochure without Amplify backend deploy
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use lts/jod
        - npm install
        - npm run lint
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
