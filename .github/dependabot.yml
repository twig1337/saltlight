# Dependabot — Site OS default
# Security alerts still open immediately outside this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      aws-amplify:
        patterns:
          - '@aws-amplify/*'
          - 'aws-amplify'
          - '@aws-sdk/*'
      sentry:
        patterns:
          - '@sentry/*'
      shadcn-radix:
        patterns:
          - '@radix-ui/*'
      next-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
    # Majors need a scheduled hygiene window, not weekly noise.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: lucide-react
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
