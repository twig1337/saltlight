# Site OS CI template — copy to .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # amplify_outputs.json is gitignored (sandbox/prod specific). CI uses the
      # committed example so Next can resolve the import at build time.
      - name: Amplify outputs stub
        run: |
          if [ ! -f amplify_outputs.json ] && [ -f amplify_outputs.example.json ]; then
            cp amplify_outputs.example.json amplify_outputs.json
          fi

      - name: Doctor
        run: npm run doctor

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
